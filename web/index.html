<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="description" content="在浏览器中离线检查 USB HID 报告描述符、字段位布局与原始报告。">
  <title>MoonHID 检查器</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="MoonHID 首页">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.2a9 9 0 1 0 5.3 13.6A8 8 0 0 1 15.5 3.2Z"/><rect x="9" y="9.6" width="9" height="1.6" rx=".8"/><rect x="9" y="12.8" width="9" height="1.6" rx=".8"/></svg>
      <span>MoonHID</span>
    </a>
    <span class="tagline">HID 报告描述符检查器</span>
    <nav class="samples" aria-label="合成样例">
      <span class="samples-label">样例</span>
      <div id="fixtures" class="segmented"><button type="button" disabled>加载中…</button></div>
    </nav>
    <div class="topbar-actions">
      <span class="offline" title="描述符与报告只在本页处理，不上传、不连接设备">离线</span>
      <button id="export" type="button" class="btn" disabled>导出 JSON</button>
      <a class="btn btn-quiet" href="https://github.com/We1chan/moonhid" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </header>

  <div id="boot-error" class="banner" role="alert" hidden>
    解析器没有加载。请先运行 <code>node scripts/build-web.mjs</code>，再通过 <code>python3 scripts/serve-web.py</code> 打开本页。
  </div>
  <noscript><div class="banner">检查器需要启用 JavaScript。</div></noscript>

  <main class="workspace">
    <section class="pane pane-source" aria-labelledby="source-title">
      <div class="pane-head">
        <h2 id="source-title"><label for="descriptor">报告描述符</label></h2>
        <span id="descriptor-meta" class="meta"></span>
      </div>
      <div class="editor editor-descriptor">
        <div class="editor-backdrop" aria-hidden="true"></div>
        <textarea id="descriptor" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="descriptor-status" placeholder="粘贴十六进制，例如 05 01 09 02 a1 01 …"></textarea>
      </div>
      <div id="descriptor-status" class="status" role="status" aria-live="polite"><span class="status-text">正在加载 MoonBit 解析器…</span></div>
      <div class="list-head">
        <h3>Items</h3>
        <span id="item-meta" class="meta"></span>
      </div>
      <div id="items" class="items"></div>
    </section>

    <section class="pane pane-report" aria-labelledby="report-title">
      <div class="report-inner">
        <div class="pane-head">
          <h2 id="report-title">报告</h2>
          <span id="report-meta" class="meta"></span>
        </div>
        <div id="reports" class="report-tabs" role="group" aria-label="选择报告布局"></div>

        <div class="report-entry">
          <div class="entry-head">
            <label for="report">原始报告</label>
            <span class="meta">十六进制，含 Report ID 前缀</span>
            <button id="sample-report" type="button" class="link" hidden>载入样例报告</button>
          </div>
          <div class="editor editor-report">
            <div class="editor-backdrop" aria-hidden="true"></div>
            <textarea id="report" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="report-status" placeholder="例如 05 ff 02 fe" disabled></textarea>
          </div>
          <div id="report-status" class="status" role="status" aria-live="polite"></div>
        </div>

        <section class="block" aria-labelledby="bitmap-title">
          <div class="block-head">
            <h3 id="bitmap-title">位布局</h3>
            <span class="legend" aria-hidden="true">
              <span><i class="sw sw-data"></i>数据</span>
              <span><i class="sw sw-pad"></i>填充</span>
              <span><i class="sw sw-unused"></i>未用</span>
              <span><i class="sw sw-rid"></i>Report ID</span>
            </span>
          </div>
          <p class="block-note">每行一个报告字节，左侧为最高位。HID 字段从每个字节的最低位开始排列。</p>
          <div id="bitmap" class="bitmap"></div>
        </section>

        <section class="block" aria-labelledby="values-title">
          <div class="block-head">
            <h3 id="values-title">字段与解码值</h3>
            <span id="values-meta" class="meta"></span>
          </div>
          <div id="values" class="table-wrap"></div>
        </section>
      </div>
    </section>

    <aside class="pane pane-detail" aria-labelledby="detail-title">
      <div class="pane-head">
        <h2 id="detail-title">字段详情</h2>
      </div>
      <div id="field-detail" class="detail"></div>
      <div class="list-head">
        <h3>Collection</h3>
        <span id="collection-meta" class="meta"></span>
      </div>
      <div id="collections" class="collections"></div>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
