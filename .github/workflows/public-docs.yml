name: Verify published documentation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-public-docs.mjs --urls docs/acceptance-urls.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-documentation-links
          path: _build/public-docs-report.json
