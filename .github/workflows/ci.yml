name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: check-build-test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          PATH="$HOME/.moon/bin:$PATH" bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: moon version --all
      - name: Initialize Mooncakes dependency index
        run: moon update
      - name: Check
        run: moon check --target ${{ matrix.target }} --deny-warn
      - name: Build
        run: moon build --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }}
      - name: Run device examples
        run: moon run cmd/main --target ${{ matrix.target }}
      - name: Build and verify browser module
        if: matrix.target == 'js'
        run: |
          node scripts/build-web.mjs
          node scripts/test-web.mjs
          node scripts/test-webhid.mjs
      - name: Verify file CLI
        if: matrix.target == 'js' || matrix.target == 'native'
        run: node scripts/test-cli.mjs ${{ matrix.target }}
      - name: Verify formatting and public API
        if: matrix.target == 'wasm'
        run: |
          moon fmt --check
          moon info
          moon info --target native
          git diff --exit-code -- '*.mbti'
      - uses: actions/setup-python@v5
        if: matrix.target == 'js'
        with:
          python-version: '3.13'
      - name: Compare real descriptors with external hid-tools
        if: matrix.target == 'js'
        run: |
          python -m pip install hid-tools==0.12
          python scripts/compare-hid-tools.py
      - name: Verify inspector DOM in headless Chrome
        if: matrix.target == 'js'
        run: node scripts/test-inspector.mjs
