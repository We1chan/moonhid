name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: check-build-test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify README and documentation links
        if: matrix.target == 'wasm'
        run: |
          node scripts/sync-readme.mjs --check
          node scripts/check-acceptance-docs.mjs
          node scripts/test-public-docs.mjs
      - name: Install recorded MoonBit toolchain
        uses: ./.github/actions/setup-moon
      - name: Record toolchain
        run: moon version --all
      - name: Initialize Mooncakes dependency index
        run: moon update
      - name: Check
        run: moon check --target ${{ matrix.target }} --deny-warn
      - name: Build
        run: moon build --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }}
      - name: Run device examples
        run: |
          moon run src/cmd/main --target ${{ matrix.target }}
          moon run src/cmd/scenarios --target ${{ matrix.target }}
      - name: Probe native HIDAPI linking and Linux UHID feasibility
        if: matrix.target == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev
          node scripts/probe-hidapi.mjs
          sudo modprobe uhid || sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe uhid || true
          python3 -m venv _build/hidapi-venv
          _build/hidapi-venv/bin/pip install hid-tools==0.12
          sudo _build/hidapi-venv/bin/python scripts/probe-hidapi-uhid.py
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'native' && always()
        with:
          name: hidapi-feasibility
          path: |
            _build/hidapi-feasibility.json
            _build/hidapi-uhid-feasibility.json
      - name: Build and verify browser module
        if: matrix.target == 'js'
        run: |
          node scripts/build-web.mjs
          node scripts/test-web.mjs
          node scripts/test-webhid.mjs
          node scripts/test-usability.mjs
          node scripts/test-acceptance.mjs
          node scripts/firmware-ci.mjs
          node scripts/package-inspector.mjs
          node scripts/test-offline.mjs
      - name: Verify file CLI
        if: matrix.target == 'js' || matrix.target == 'native'
        run: |
          node scripts/test-cli.mjs ${{ matrix.target }}
          node scripts/test-compatibility.mjs ${{ matrix.target }}
      - name: Verify formatting and public API
        if: matrix.target == 'wasm'
        run: |
          moon fmt --check
          moon info
          moon info --target native
          git diff --exit-code -- '*.mbti'
      - uses: actions/setup-python@v5
        if: matrix.target == 'js'
        with:
          python-version: '3.13'
      - name: Compare real descriptors with external hid-tools
        if: matrix.target == 'js'
        run: |
          python -m pip install hid-tools==0.12
          python scripts/compare-hid-tools.py
          python scripts/compare-codec-hid-tools.py
      - name: Verify inspector DOM in headless Chrome
        if: matrix.target == 'js'
        run: node scripts/test-inspector.mjs
      - name: Verify one-command acceptance (wasm/js)
        if: matrix.target == 'js'
        run: node scripts/acceptance.mjs --quick
      - name: Record performance baseline
        if: matrix.target == 'js'
        run: node --expose-gc scripts/benchmark.mjs > _build/benchmark.json
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'js'
        with:
          name: inspector-and-benchmark
          path: |
            _build/distribution/
            _build/benchmark.json
            _build/acceptance-report.json
            _build/acceptance-logs/

  latest-compatible:
    name: latest-toolchain (js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-moon
        with:
          version: latest
      - run: moon update && moon check --target js --deny-warn && moon test --target js
      - run: node scripts/build-web.mjs && node scripts/test-web.mjs && node scripts/test-usability.mjs
